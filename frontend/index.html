THESIS — The Survey: a society of specialists measures an unknown decision into a publishable
sheet — territories, stations, lines of sight, a triangulated fix. It refuses the category's
dark neon agent-graph console and its cream/serif/terracotta editorial twin.

OWN-WORLD — Cool linen sheet (#E7E5DB) under ink (#1A1814); a datum-blue graticule; a functional
map legend where colour is data — stance green/slate/amber/vermilion; brass reserved for
annotation; the fix in vermilion. No enclosing cards: rules, baselines, and type carry
structure. Titling Archivo, the record Spectral, measurement JetBrains Mono, every figure
coordinate-set. One dark surface only: the plotting table.

STORY — The owner learns this is many specialists surveying their decision, believes it because
the survey plots itself live with a confidence and the case against plainly hatched, and begins
a survey.

FIRST VIEWPORT — A full-bleed survey sheet: the question as the sheet's title in large Archivo
caps; a live-plotted territory (green/slate/amber/vermilion stations, traced sightlines, a brass
fix and a closure figure) filling the sheet; a legend at its foot; the primary action ("Begin a
survey") at the bottom of the sheet where the surveyor signs.

FORM — The Survey, position 7 of 7 on the grounded list (assigned), seed key de9df9f6.

FINISH — unreviewed and undocumented is unfinished; this build ends with the finish review, the
verdict, and DESIGN.md.
