# Tooling configuration for lint / format / type-check (Task 8 CI).
# Application runtime dependencies live in requirements.txt; this file holds
# no `[project]` table on purpose — the repo is not an installable package.

[tool.ruff]
line-length = 88
target-version = "py311"
# Autogenerated Alembic migrations are kept out of the mechanical format pass.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# First CI pass, deliberately narrow: pyflakes correctness (F), import
# ordering (I) and the pycodestyle error classes (E9).
#
# NOT enabled on purpose — each is legitimate but requires hand-editing the
# pre-existing tree, which is out of scope for this task (same ruling as the
# scoped mypy in .github/workflows/main.yml):
#   * E4/E7 (E402 module-import-not-at-top, E702 multiple-statements-on-one-line,
#     E741 ambiguous name, E731 lambda assignment) — ~160 stylistic hits, 140 of
#     them one-line `a = 1; b = 2` splits in tests/graph/*.
#   * UP/BLE/B/RUF/PLR/SIM/DTZ — ~570 hits (PEP 585/604 annotations, blind excepts,
#     datetime.utcnow) spread across legacy modules.
# Widen `select` once the legacy tree is triaged.
select = ["E9", "F", "I"]

[tool.black]
line-length = 88
target-version = ["py311"]
extend-exclude = "alembic/versions"

[tool.mypy]
python_version = "3.11"
# src/ is a namespace package (no __init__.py), so without this mypy resolves
# the same file as both `config.settings` and `src.config.settings`.
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
# The third-party tree (litellm, llama-index, neo4j, ...) ships no stubs and
# is not worth typing here.
ignore_missing_imports = true
# Imported-but-not-listed legacy modules are still parsed, but their errors are
# silenced — the initial CI scope is the new modules only (R25).
follow_imports = "silent"
warn_unused_ignores = false
